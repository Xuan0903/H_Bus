services:
  redis_v2:
    image: redis:7-alpine
    container_name: hbus-redis-v2
    ports:
      - "6380:6379"
    volumes:
      - ./redis_data_v2:/data
    networks:
      - hbus-net-v2

  mariadb_v2:
    image: mariadb:10.11
    container_name: hbus-mariadb-v2
    environment:
      - MARIADB_ROOT_PASSWORD=109109
      - MARIADB_DATABASE=bus_system
    user: "root"
    command: ["--port=3308"]
    ports:
      - "3308:3308"
    volumes:
      - ./db_data_v2:/var/lib/mysql
      - ./bus_system_backup.sql:/docker-entrypoint-initdb.d/bus_system_backup.sql
    networks:
      - hbus-net-v2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  client-api-v2:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    container_name: hbus-client-api-v2
    ports:
      - "8900:8900"
    environment:
      REDIS_URL: "redis://hbus-redis-v2:6379/0"
      FRONTEND_DEFAULT_URL: "https://hualenbus.labelnine.app:8900"
      LINE_CHANNEL_ID: "2008339768"
      LINE_CHANNEL_SECRET: "e8e798ff0397095f97b1ec5c8e710e8a"
      APP_SESSION_SECRET: "sd8f7s9df8sdf7"
      Sender_email: "trkbus.hualien@gmail.com"
      Password_email: "glrt gvzx cnid gfca"
      Host: "hbus-mariadb-v2"
      User: "root"
      Port: "3308"
      Password_SQL: "109109"
      Database: "bus_system"
      MERCHANT_ID: "970612408190001"
      TERMINAL_ID: "70002166"
      STORE_CODE: "288cc740-49e9-4d7b-a47a-6b140024d80e"
      KEY: "14e4753bc9255e2f9f0843c785e8a67314054be65db37164c6cecbec6e081bf7"
      IV: "9f1de944d491a73be31b95c8ace7a4ab"
      LAYMON: "iqrc.epay365.com.tw"
      TZ: "Asia/Taipei"
      MAIL_SEND_HOUR: "8"
      MAIL_SEND_MIN: "0"
      ALLOWED_RETURN_ORIGINS: "https://hualenbus.labelnine.app:8900,http://localhost:8900"
    depends_on:
      mariadb_v2:
        condition: service_healthy
      redis_v2:
        condition: service_started
    # volumes:
    #   - "D:/SSL:/ssl:ro"
    networks:
