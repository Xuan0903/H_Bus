    # command: >
    #   bash -c "sleep 15 && uvicorn Server:app --host 0.0.0.0 --port 8900 --ssl-keyfile /ssl/hualenbus.labelnine.app-key.pem --ssl-certfile /ssl/hualenbus.labelnine.app-chain.pem --reload"
    command: >
      bash -c "sleep 15 && uvicorn Server:app --host 0.0.0.0 --port 8900 --reload"

  bus-api-v2:
    build:
      context: ./my-bus-system
      dockerfile: Dockerfile
    container_name: hbus-bus-api-v2
    ports:
      - "8800:8800"
    environment:
      Host: "hbus-mariadb-v2"
      User: "root"
      Port: "3308"
      Password_SQL: "109109"
      Database: "bus_system"
    depends_on:
      mariadb_v2:
        condition: service_healthy
      redis_v2:
        condition: service_started
    # volumes:
    #   - "D:/SSL:/ssl:ro"
    networks:
      - hbus-net-v2
    # command: >
    #   bash -c "npm run serve"
    command: >
      bash -c "npm run build && python3 -m uvicorn app:app --host 0.0.0.0 --port 8800 --reload --log-level info"    
volumes:
  mysql_data_v2:
  mariadb_data_v2:

networks:
  hbus-net-v2:
    name: hbus-net-v2   # 🔹 固定網路名稱，避免出現 h_bus2_hbus-net-v2 這種變體
    driver: bridge
